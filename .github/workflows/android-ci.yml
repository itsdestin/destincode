name: Android CI

on:
  push:
    branches: [master, 'feature/**', 'fix/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Explicit Node setup — bundleWebUi (Gradle preBuild dep) shells out
      # to `npm` via scripts/build-web-ui.sh. ubuntu-latest happens to
      # ship a node binary today, but pinning here removes the runner-
      # image dep so CI doesn't silently drift if the image changes.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # bundleWebUi (a Gradle dep of preBuild) shells out to
      # scripts/build-web-ui.sh, which runs `npm run build` in desktop/. That
      # invokes electron-builder for ALL configured Linux targets
      # (AppImage + deb + rpm + pacman), so the runner needs rpm + bsdtar
      # even though Android doesn't consume the installers. PR #98 added
      # pacman+rpm targets without updating this workflow; every Android CI
      # run since 2026-05-20 has been red on bsdtar exit 127.
      #   libarchive-tools -> provides bsdtar (pacman target)
      #   rpm              -> rpm target
      - name: Install Linux build deps
        # `apt-get update` prefix: the cached package index on ubuntu-latest
        # often points to .deb versions that have rolled off the mirror, so
        # a bare install hits HTTP 404 / exit 100. Refresh the index first.
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      - name: Run unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # ReleaseTest: same R8 minification + shrinker + proguard rules as
      # the production release flavor, but signed with the debug keystore
      # so it can run without the release-keystore secrets.
      #
      # Why this lives in dev CI (not just release): debug builds skip R8
      # entirely, hiding any bug whose trigger involves R8 obfuscation,
      # shrinking, or inlining. The PluginInstaller reflection footgun
      # (912f5ca7) shipped silently from 2026-03-25 through v1.2.2
      # because every dev/CI build was debug — pre-release verification
      # never ran the same code path the user would. Building releaseTest
      # on every push catches that whole bug class at PR time.
      - name: Build releaseTest APK (R8 minified, debug-signed)
        run: ./gradlew assembleReleaseTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: youcoded-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload releaseTest APK
        uses: actions/upload-artifact@v4
        with:
          name: youcoded-releasetest
          path: app/build/outputs/apk/releaseTest/*.apk
          retention-days: 14

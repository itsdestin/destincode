name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      # Don't cancel in-flight Windows/Mac builds if one platform fails —
      # we'd rather ship 2/3 platforms than 0/3.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: desktop/release/*.exe
            name: windows
          - os: macos-latest
            artifact: desktop/release/*.dmg
            name: macos
          - os: ubuntu-latest
            artifact: |
              desktop/release/*.AppImage
              desktop/release/*.deb
              desktop/release/*.rpm
              desktop/release/*.pacman
            name: linux

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          node -e "var p=require('path').resolve('package.json'),pkg=JSON.parse(require('fs').readFileSync(p,'utf8'));pkg.version=process.argv[1];require('fs').writeFileSync(p,JSON.stringify(pkg,null,2)+'\n')" "$TAG_VERSION"
          echo "Set desktop/package.json version to $TAG_VERSION"

      - name: Install dependencies
        run: npm ci

      # Keep in sync with desktop-test-build.yml's identical step.
      # macos-latest runners are arm64, so `npm ci` installs only the darwin-arm64
      # variant of any package that ships its binaries as per-platform
      # optionalDependencies. electron-builder cuts BOTH the x64 and arm64 dmgs from
      # this single node_modules tree (npmRebuild is false), so without this step the
      # x64 dmg ships arm64 binaries: ripgrep throws "Could not find
      # @vscode/ripgrep-darwin-x64" and kills the main process at launch, and
      # @napi-rs/canvas (a pdfjs-dist dep) breaks PDF rendering. --force bypasses the
      # os/cpu guard that would otherwise skip a foreign-arch package. Versions are
      # read from the installed tree so a dependency bump can't silently desync them.
      - name: Add darwin-x64 binaries for the x64 dmg
        if: matrix.name == 'macos'
        shell: bash
        run: |
          # Read package.json off disk rather than require()-ing it: @vscode/ripgrep
          # declares an "exports" map that only exposes ".", so requiring the
          # subpath fails with ERR_PACKAGE_PATH_NOT_EXPORTED.
          ver() { node -p "JSON.parse(require('fs').readFileSync('node_modules/$1/package.json','utf8')).version"; }
          RG=$(ver @vscode/ripgrep)
          CANVAS=$(ver @napi-rs/canvas)
          npm i --no-save --force \
            "@vscode/ripgrep-darwin-x64@$RG" \
            "@napi-rs/canvas-darwin-x64@$CANVAS"

      - name: Run tests
        run: npm test

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        # Must run BEFORE the build — electron-builder's deb/rpm/pacman
        # packagers run inside `npm run build`:
        #   libarchive-tools -> provides bsdtar, required by the pacman target
        #   rpm              -> required by the rpm target
        #   xvfb             -> headless display for the smoke test below
        run: sudo apt-get install -y xvfb rpm libarchive-tools
        working-directory: .

      - name: Build
        run: npm run build


      # WHY: electron-builder SILENTLY skips macOS signing when it cannot sign, and a
      # Dependabot bump did exactly that on 2026-07-23 (26.8.1 -> 26.15.3 dropped the
      # ad-hoc fallback). Every Mac build from then to 2026-09-03 shipped without a
      # seal, which macOS treats as a BROKEN app — no "Open Anyway" button, no way in —
      # and not one check anywhere went red. An unsigned bundle has no _CodeSignature
      # directory and keeps the stock Electron identifier, so assert both.
      - name: Verify the macOS bundle is signed
        if: matrix.name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r app; do
            found=$((found + 1))
            echo "checking $app"
            if [ ! -d "$app/Contents/_CodeSignature" ]; then
              echo "::error::$app has no _CodeSignature seal - electron-builder skipped signing"
              exit 1
            fi
            ident=$(codesign -d --verbose=2 "$app" 2>&1 | sed -n 's/^Identifier=//p')
            if [ "$ident" != "com.youcoded.desktop" ]; then
              echo "::error::$app signing identifier is '$ident', expected com.youcoded.desktop"
              exit 1
            fi
          done < <(find release -maxdepth 2 -name 'YouCoded.app' -type d)
          if [ "$found" -eq 0 ]; then
            echo "::error::no YouCoded.app found under desktop/release/"
            exit 1
          fi
          echo "$found macOS bundle(s) signed and sealed"

      - name: Smoke test
        # Launch the production build briefly and verify no renderer crash.
        # Uses xvfb on Linux since there's no display server in CI.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum node scripts/smoke-test.js
          else
            node scripts/smoke-test.js
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: youcoded-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact }}

  upload:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Upload installers to release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*

name: fswatch probe (macOS investigation)

# TEMPORARY instrument for the recurring macOS watcher failure
# (docs/active/investigations/2026-09-01-sync-engine-debounce-macos-flake.md).
# Deliberately dependency-free so a run costs seconds, not the ~6 minutes a
# full Desktop CI macOS leg costs — the investigation needs many iterations.
# Delete once the cause is known.
#
# Round 1 established that fs.watch on the macOS runner is reliable in steady
# state: ~1,000 trials, zero misses, including 12 concurrent processes, CPU
# contention, and 200 live watchers. The one thing round 1 did NOT vary is the
# gap between fs.watch() returning and the first write — it always waited 50ms.
# The failing tests write immediately. Round 2 sweeps that gap.

on:
  workflow_dispatch:
  push:
    branches: [fix/macos-fswatch]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }

      - name: Arming-window sweep — the write happens N ms after fs.watch() returns
        run: |
          for d in 0 1 2 5 10 25 50 100; do
            printf 'arm-delay=%-4s ' "$d"
            node scripts/diag/fswatch-probe.mjs --trials 100 --arm-delay "$d" --timeout 2000 \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(`missed ${j.missed}/${j.trials}  median ${j.medianMs}ms  max ${j.maxMs}ms`)})' || true
          done

      - name: Arming window under CPU contention (the load correlation)
        run: |
          for d in 0 5 25; do
            printf 'arm-delay=%-4s under load: ' "$d"
            node scripts/diag/fswatch-probe.mjs --procs 8 --trials 25 --cpu 6 --arm-delay "$d" --timeout 2000 \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(`missed ${j.totalMissed}/${j.totalTrials}`)})' || true
          done

      - name: Both suites, 15x each, under CPU contention (baseline was 4/15 red)
        run: |
          npm ci --silent
          node -e 'const{spawn}=require("child_process");for(let i=0;i<6;i++)spawn(process.execPath,["-e","const e=Date.now()+600000;while(Date.now()<e){Math.sqrt(Math.random())}"],{stdio:"ignore",detached:true}).unref()'
          for suite in tests/git/git-watcher.test.ts tests/sync-spaces-engine.test.ts; do
            fails=0
            for i in $(seq 1 15); do
              npx vitest run "$suite" > /tmp/r.txt 2>&1 || { fails=$((fails+1)); grep -E "AssertionError" /tmp/r.txt | head -2; }
            done
            echo "$suite -> FAILURES: $fails / 15"
          done
          pgrep -f 'Math.sqrt' | xargs -r kill

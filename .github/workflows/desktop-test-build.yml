name: Desktop Test Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to stamp into the build. MUST sort ABOVE the latest published
          release, or the installed build will offer to "update" itself back to
          that release (compareVersions in ipc-handlers.ts parses naively:
          `1.2.4-beta` -> [1,2,0], which is LOWER than 1.2.4). Bump the minor
          and suffix, e.g. 1.3.0-beta, rather than patching the current version.
        required: false
        default: '1.3.0-beta'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: desktop/release/*.exe
            name: windows
          - os: macos-latest
            artifact: desktop/release/*.dmg
            name: macos
          - os: ubuntu-latest
            # Mirrors desktop-release.yml. electron-builder.yml has built all
            # four Linux targets since #98, but this workflow kept globbing only
            # the AppImage — so a beta silently discarded the deb/rpm/pacman it
            # had just built, and they were untestable before a release carried
            # them (#98 postdates the v1.2.4 tag, so none ever has).
            artifact: |
              desktop/release/*.AppImage
              desktop/release/*.deb
              desktop/release/*.rpm
              desktop/release/*.pacman
            name: linux

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # Mirrors desktop-release.yml's "Sync version from tag". Without this the
      # build inherits package.json's version — the LAST RELEASED one — so a test
      # build is indistinguishable from the real release in Settings → About, in
      # analytics (analytics-service.ts reports app.getVersion()), and in bug
      # reports. Both __APP_VERSION__ and app.getVersion() derive from this file,
      # so stamping it here fixes every surface at once.
      - name: Stamp beta version
        shell: bash
        run: |
          BETA_VERSION="${{ inputs.version }}"
          node -e "var p=require('path').resolve('package.json'),pkg=JSON.parse(require('fs').readFileSync(p,'utf8'));pkg.version=process.argv[1];require('fs').writeFileSync(p,JSON.stringify(pkg,null,2)+'\n')" "$BETA_VERSION"
          echo "Set desktop/package.json version to $BETA_VERSION"

      - name: Install dependencies
        run: npm ci

      # macos-latest runners are arm64, so `npm ci` installs only the darwin-arm64
      # variant of any package that ships its binaries as per-platform
      # optionalDependencies. electron-builder cuts BOTH the x64 and arm64 dmgs from
      # this single node_modules tree (npmRebuild is false), so without this step the
      # x64 dmg ships arm64 binaries: ripgrep throws "Could not find
      # @vscode/ripgrep-darwin-x64" and kills the main process at launch, and
      # @napi-rs/canvas (a pdfjs-dist dep) breaks PDF rendering. --force bypasses the
      # os/cpu guard that would otherwise skip a foreign-arch package. Versions are
      # read from the installed tree so a dependency bump can't silently desync them.
      - name: Add darwin-x64 binaries for the x64 dmg
        if: matrix.name == 'macos'
        shell: bash
        run: |
          RG=$(node -p "require('@vscode/ripgrep/package.json').version")
          CANVAS=$(node -p "require('@napi-rs/canvas/package.json').version")
          npm i --no-save --force \
            "@vscode/ripgrep-darwin-x64@$RG" \
            "@napi-rs/canvas-darwin-x64@$CANVAS"

      - name: Run tests
        run: npm test

      # Must run BEFORE the build — electron-builder's deb/rpm/pacman packagers
      # run inside `npm run build`. See desktop-ci.yml for the PR #98 backstory.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        # `apt-get update` prefix: the cached package index on ubuntu-latest
        # often points to .deb versions that have rolled off the mirror, so
        # a bare install hits HTTP 404 / exit 100. Refresh the index first.
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
        working-directory: .

      - name: Build
        # Vite bakes this into __BUILD_CHANNEL__, which renders the "(BETA)" tag
        # in Settings → About. Release builds never set it, so they render clean.
        env:
          YOUCODED_BUILD_CHANNEL: BETA
        run: npm run build

      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb
        working-directory: .

      - name: Smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum node scripts/smoke-test.js
          else
            node scripts/smoke-test.js
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: youcoded-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          retention-days: 7

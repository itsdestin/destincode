  <!-- The site's nav mark, as the browser-tab icon: the same solid accent
       square (brand-tile, border-radius 9/26 of the side) carrying the same
       built-in mascot silhouette the header shows. The mascot is inset 72%,
       not the header's 60%: measured at 16px (a real tab) the 60% glyph is
       mush, and 80% has its arms touching the corner radius.

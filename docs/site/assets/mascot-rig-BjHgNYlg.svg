        <ellipse cx="14.7" cy="10" rx="1.15" ry="1.6" fill="#3A1420"/>
        <g class="pupil"><circle cx="9.65" cy="9.35" r="0.5" fill="#FFFFFF"/><circle cx="8.95" cy="10.4" r="0.2" fill="#FFFFFF"/></g>
        <g class="pupil"><circle cx="15.05" cy="9.35" r="0.5" fill="#FFFFFF"/><circle cx="14.35" cy="10.4" r="0.2" fill="#FFFFFF"/></g>
        <path d="M13.6 7.5 Q14.7 7 15.8 7.5" fill="none" stroke="#3A1420" stroke-width="0.45" stroke-linecap="round"/>
        <ellipse cx="12" cy="11.9" rx="0.5" ry="0.35" fill="#F7C948"/>
        <ellipse cx="12" cy="13.1" rx="0.45" ry="0.55" fill="none" stroke="#3A1420" stroke-width="0.6"/>
        <g stroke="#3A1420" stroke-width="0.4" stroke-linecap="round">
          <line x1="5.5" y1="10.5" x2="7" y2="10.5"/><line x1="5.5" y1="11.5" x2="7" y2="11.5"/>
          <line x1="17" y1="10.5" x2="18.5" y2="10.5"/><line x1="17" y1="11.5" x2="18.5" y2="11.5"/>
        </g>
      </g>
      <g id="rig-face-shocked" style="display:none">
        <circle cx="9.3" cy="10" r="1.7" fill="#3A1420"/>
        <circle cx="14.7" cy="10" r="1.7" fill="#3A1420"/>
        <circle cx="9.7" cy="9.5" r="0.45" fill="#FFFFFF"/><circle cx="15.1" cy="9.5" r="0.45" fill="#FFFFFF"/>
        <ellipse cx="12" cy="11.6" rx="0.5" ry="0.35" fill="#F7C948"/>
        <ellipse cx="12" cy="13.2" rx="0.7" ry="0.9" fill="#3A1420"/>
        <g stroke="#3A1420" stroke-width="0.4" stroke-linecap="round">

          <line x1="13.4" y1="8.8" x2="16" y2="11.4"/><line x1="16" y1="8.8" x2="13.4" y2="11.4"/>
        </g>
        <ellipse cx="12" cy="12.1" rx="0.5" ry="0.35" fill="#F7C948"/>

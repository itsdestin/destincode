<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -5 30 30">
  <!--
    Example rig: Strawberry Kitty — the theme's flat mascot set rebuilt to the rig contract.
    Outline (white-body) style: depth comes from the shade gradient, not highlights.
    Identity colors (hardcoded on purpose):
      line #3A1420 (theme fg) · berry #E14560 · leaf #6DB56D · nose #F7C948 · shade #f4d4dc
    Signature component baked into slot-hat: cat ears + bow + strawberry charm
    (also in ../components/hats/kitty-ears.svg). The nose lives inside every face
    group so it swaps cleanly with expressions.
    Contract: ../README.md
  -->
  <defs>
    <linearGradient id="g-lo" x1="0" y1="0" x2="0.22" y2="1">
      <stop offset="52%" stop-color="#f4d4dc" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f4d4dc" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <g id="rig-root">
    <g id="rig-arm-left" data-pivot="2.5 9">
      <rect x="1" y="9" width="3" height="4" rx="0.8" fill="#FFFFFF" stroke="#3A1420" stroke-width="0.6"/>
    </g>
    <g id="rig-arm-right" data-pivot="21.5 9">
      <rect x="20" y="9" width="3" height="4" rx="0.8" fill="#FFFFFF" stroke="#3A1420" stroke-width="0.6"/>
      <g id="slot-item"/>
    </g>
    <g id="rig-leg-left" data-pivot="8.95 17">
      <rect x="7.2" y="17" width="3.5" height="4" rx="1.2" fill="#FFFFFF" stroke="#3A1420" stroke-width="0.6"/>
    </g>
    <g id="rig-leg-right" data-pivot="15.05 17">
      <rect x="13.3" y="17" width="3.5" height="4" rx="1.2" fill="#FFFFFF" stroke="#3A1420" stroke-width="0.6"/>
    </g>
    <g id="rig-body">
      <path d="M9 4 L15 4 A4 4 0 0 1 19 8 L19 12 A4 4 0 0 1 15 16 L9 16 A4 4 0 0 1 5 12 L5 8 A4 4 0 0 1 9 4 Z" fill="#FFFFFF" stroke="#3A1420" stroke-width="0.6"/>
      <path d="M9 4 L15 4 A4 4 0 0 1 19 8 L19 12 A4 4 0 0 1 15 16 L9 16 A4 4 0 0 1 5 12 L5 8 A4 4 0 0 1 9 4 Z" fill="url(#g-lo)"/>
      <g id="rig-face-idle">
        <path d="M7.5 9.2 L10 10.2 L7.5 11.2" fill="none" stroke="#3A1420" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16.5 9.2 L14 10.2 L16.5 11.2" fill="none" stroke="#3A1420" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
        <ellipse cx="12" cy="11.2" rx="0.5" ry="0.35" fill="#F7C948"/>
        <path d="M11 12.6 Q12 13.4 13 12.6" fill="none" stroke="#3A1420" stroke-width="0.8" stroke-linecap="round"/>
        <g stroke="#3A1420" stroke-width="0.4" stroke-linecap="round">

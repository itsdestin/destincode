        <g stroke="#3A1420" stroke-width="0.4" stroke-linecap="round">
          <line x1="5.5" y1="11" x2="7" y2="11.3"/><line x1="5.5" y1="12" x2="7" y2="12.3"/>
          <line x1="17" y1="11.3" x2="18.5" y2="11"/><line x1="17" y1="12.3" x2="18.5" y2="12"/>
        </g>
        <path d="M5 3 Q6 2 7 3 Q6 4 5 3" fill="none" stroke="#E14560" stroke-width="0.5" stroke-linecap="round"/>
        <path d="M18 3 Q19 2 20 3 Q19 4 18 3" fill="none" stroke="#E14560" stroke-width="0.5" stroke-linecap="round"/>
      </g>
      <g id="rig-face-blink" style="display:none">
        <path d="M8 10 Q9.3 10.9 10.6 10" fill="none" stroke="#3A1420" stroke-width="0.9" stroke-linecap="round"/>
        <path d="M13.4 10 Q14.7 10.9 16 10" fill="none" stroke="#3A1420" stroke-width="0.9" stroke-linecap="round"/>
        <ellipse cx="12" cy="11.2" rx="0.5" ry="0.35" fill="#F7C948"/>
        <path d="M11 12.6 Q12 13.4 13 12.6" fill="none" stroke="#3A1420" stroke-width="0.8" stroke-linecap="round"/>
        <g stroke="#3A1420" stroke-width="0.4" stroke-linecap="round">
          <line x1="5.5" y1="10.5" x2="7" y2="10.5"/><line x1="5.5" y1="11.5" x2="7" y2="11.5"/>
          <line x1="17" y1="10.5" x2="18.5" y2="10.5"/><line x1="17" y1="11.5" x2="18.5" y2="11.5"/>
        </g>
      </g>
      <g id="slot-eyewear"/>
    </g>
    <g id="slot-hat">
      <!-- signature component: cat ears + bow + strawberry (also in ../components/hats/kitty-ears.svg) -->
      <path d="M6 4.3 L6.8 1.8 L9 4 Z" fill="#FFFFFF" stroke="#3A1420" stroke-width="0.6"/>
      <path d="M18 4.3 L17.2 1.8 L15 4 Z" fill="#FFFFFF" stroke="#3A1420" stroke-width="0.6"/>
      <path d="M17.2 3.3 L16.2 2.5 L16.2 4 Z" fill="#E14560"/>
      <path d="M17.2 3.3 L18.2 2.5 L18.2 4 Z" fill="#E14560"/>
      <circle cx="17.2" cy="3.3" r="0.35" fill="#E14560"/>
      <path d="M6.7 5.2 Q6 6 6.2 6.8 Q6.6 7.6 7.4 7.5 Q8 7.2 8.1 6.3 Q8 5.4 7.4 5.1 Z" fill="#E14560"/>
      <path d="M6.5 5.1 L7.6 4.9 L7.5 5.4 L6.9 5.5 Z" fill="#6DB56D"/>
      <circle cx="6.8" cy="6.0" r="0.1" fill="#FFF2A8"/><circle cx="7.4" cy="6.0" r="0.1" fill="#FFF2A8"/><circle cx="7.1" cy="6.6" r="0.1" fill="#FFF2A8"/>
    </g>
    <g id="rig-hand-peek-right" style="display:none">
      <rect x="20.7" y="8.3" width="2.6" height="3.4" rx="1.17" fill="#FFFFFF" stroke="#3A1420" stroke-width="0.6"/>
    </g>
    <g id="rig-hand-peek-left" style="display:none">
      <rect x="0.7" y="8.3" width="2.6" height="3.4" rx="1.17" fill="#FFFFFF" stroke="#3A1420" stroke-width="0.6"/>
    </g>

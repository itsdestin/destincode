<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Halftone Dimension mascot — welcome (sparkle eyes, waving)
       2026-07-16 rebuild: solid ink-navy body + painted face replaces the currentColor
       cutout model (rendered black via <img>). Matches assets/mascot-rig.svg identity. -->
  <defs>
    <radialGradient id="fhw-hi" cx="33%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#332852" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#332852" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fhw-lo" x1="0" y1="0" x2="0.22" y2="1">
      <stop offset="52%" stop-color="#0b0813" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b0813" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="fhw-limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191327"/>
      <stop offset="100%" stop-color="#0b0813"/>
    </linearGradient>
  </defs>
  <!-- Dimensional glitch lines -->
  <rect x="3" y="5" width="18" height="0.5" rx="0.25" fill="#00b8ff" opacity="0.3"/>
  <rect x="4" y="14.5" width="16" height="0.5" rx="0.25" fill="#e8234a" opacity="0.25"/>
  <!-- Left arm (relaxed), right arm raised in a wave — baked pose, flat tier has no rig -->
  <g transform="translate(0.3 1.0) rotate(-10 2.5 11)">
    <path d="M1.8 9 L3.2 9 A0.8 0.8 0 0 1 4 9.8 L4 12.2 A0.8 0.8 0 0 1 3.2 13 L1.8 13 A0.8 0.8 0 0 1 1 12.2 L1 9.8 A0.8 0.8 0 0 1 1.8 9 Z" fill="url(#fhw-limb)" stroke="#00b8ff" stroke-width="0.14" stroke-opacity="0.5"/>
  </g>
  <g transform="translate(-0.1 0.8) rotate(-20 19.5 6)">
    <path d="M20.8 2.5 L22.2 2.5 A0.8 0.8 0 0 1 23 3.3 L23 5.7 A0.8 0.8 0 0 1 22.2 6.5 L20.8 6.5 A0.8 0.8 0 0 1 20 5.7 L20 3.3 A0.8 0.8 0 0 1 20.8 2.5 Z" fill="url(#fhw-limb)" stroke="#e8234a" stroke-width="0.14" stroke-opacity="0.5"/>
  </g>
  <rect x="7.2" y="17" width="3.5" height="4" rx="1.2" fill="url(#fhw-limb)" stroke="#00b8ff" stroke-width="0.14" stroke-opacity="0.4"/>
  <rect x="13.3" y="17" width="3.5" height="4" rx="1.2" fill="url(#fhw-limb)" stroke="#e8234a" stroke-width="0.14" stroke-opacity="0.4"/>
  <!-- Body -->
  <path d="M9 4 L15 4 A4 4 0 0 1 19 8 L19 12 A4 4 0 0 1 15 16 L9 16 A4 4 0 0 1 5 12 L5 8 A4 4 0 0 1 9 4 Z" fill="#191327"/>
  <path d="M9 4 L15 4 A4 4 0 0 1 19 8 L19 12 A4 4 0 0 1 15 16 L9 16 A4 4 0 0 1 5 12 L5 8 A4 4 0 0 1 9 4 Z" fill="url(#fhw-lo)"/>
  <path d="M9 4 L15 4 A4 4 0 0 1 19 8 L19 12 A4 4 0 0 1 15 16 L9 16 A4 4 0 0 1 5 12 L5 8 A4 4 0 0 1 9 4 Z" fill="url(#fhw-hi)"/>
  <path d="M5 11.5 L5 8 A4 4 0 0 1 9 4 L12 4" fill="none" stroke="#00b8ff" stroke-width="0.35" opacity="0.75"/>
  <path d="M19 8.5 L19 12 A4 4 0 0 1 15 16 L12.5 16" fill="none" stroke="#e8234a" stroke-width="0.35" opacity="0.75"/>
  <!-- Painted welcome eyes: tall sockets + CMYK sparkle clusters -->
  <ellipse cx="9.3" cy="9.55" rx="1.6" ry="2.2" fill="#eef2fa"/>
  <ellipse cx="14.7" cy="9.25" rx="1.6" ry="2.2" fill="#eef2fa"/>
  <!-- Visor (lower opacity so the eyes read through, as in the original) -->
  <rect x="5.8" y="7.5" width="12.4" height="2.5" rx="1" fill="#e8234a" opacity="0.4"/>
  <rect x="6.2" y="7.8" width="11.6" height="1.8" rx="0.8" fill="#08060e" opacity="0.35"/>
  <circle cx="10" cy="10.25" r="0.3" fill="#e8234a" opacity="0.9"/>
  <circle cx="9.4" cy="10.85" r="0.2" fill="#00b8ff" opacity="0.75"/>
  <circle cx="10.3" cy="10.85" r="0.15" fill="#ffea00" opacity="0.6"/>
  <circle cx="15.4" cy="9.95" r="0.3" fill="#e8234a" opacity="0.9"/>
  <circle cx="14.8" cy="10.55" r="0.2" fill="#00b8ff" opacity="0.75"/>
  <circle cx="15.7" cy="10.55" r="0.15" fill="#ffea00" opacity="0.6"/>
  <g transform="rotate(-2 12 13.3)"><path d="M10.8 13.3 Q10.8 13 12 13 Q13.2 13 13.2 13.3 A1.1 1 0 0 1 10.8 13.3 Z" fill="#eef2fa"/></g>
  <!-- Halftone dots -->
  <circle cx="7" cy="6" r="0.35" fill="#e8234a" opacity="0.25"/>
  <circle cx="17" cy="5.8" r="0.35" fill="#00b8ff" opacity="0.2"/>
  <circle cx="8" cy="14.5" r="0.35" fill="#e8234a" opacity="0.2"/>
  <circle cx="16" cy="14" r="0.3" fill="#ffea00" opacity="0.15"/>
  <!-- Chromatic aberration ghosts -->
  <rect x="19.3" y="7.5" width="0.4" height="5" rx="0.2" fill="#e8234a" opacity="0.2"/>
  <rect x="4.4" y="8" width="0.4" height="4.5" rx="0.2" fill="#00b8ff" opacity="0.2"/>
</svg>

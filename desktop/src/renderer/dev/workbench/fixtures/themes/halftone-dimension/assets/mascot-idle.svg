<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Halftone Dimension mascot — idle (>< squinting eyes)
       2026-07-16 rebuild: the original drew the body in currentColor, which renders BLACK
       through the app's <img> path (invisible on the dark canvas). Body is now the theme's
       ink-navy identity (#191327) with the face PAINTED on top (#eef2fa face — the old #1e2636 was invisible on this body), matching
       assets/mascot-rig.svg — cutout eyes are gone (they read as holes to the desktop in
       the transparent buddy window). -->
  <defs>
    <radialGradient id="fhi-hi" cx="33%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#332852" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#332852" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fhi-lo" x1="0" y1="0" x2="0.22" y2="1">
      <stop offset="52%" stop-color="#0b0813" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b0813" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="fhi-limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191327"/>
      <stop offset="100%" stop-color="#0b0813"/>
    </linearGradient>
  </defs>
  <!-- Dimensional glitch lines behind body -->
  <rect x="3" y="5.5" width="18" height="0.6" rx="0.3" fill="#00b8ff" opacity="0.3"/>
  <rect x="4" y="14" width="16" height="0.5" rx="0.25" fill="#e8234a" opacity="0.25"/>
  <!-- Limbs -->
  <path d="M1.8 9 L3.2 9 A0.8 0.8 0 0 1 4 9.8 L4 12.2 A0.8 0.8 0 0 1 3.2 13 L1.8 13 A0.8 0.8 0 0 1 1 12.2 L1 9.8 A0.8 0.8 0 0 1 1.8 9 Z" fill="url(#fhi-limb)" stroke="#00b8ff" stroke-width="0.14" stroke-opacity="0.5"/>
  <path d="M20.8 9 L22.2 9 A0.8 0.8 0 0 1 23 9.8 L23 12.2 A0.8 0.8 0 0 1 22.2 13 L20.8 13 A0.8 0.8 0 0 1 20 12.2 L20 9.8 A0.8 0.8 0 0 1 20.8 9 Z" fill="url(#fhi-limb)" stroke="#e8234a" stroke-width="0.14" stroke-opacity="0.5"/>
  <rect x="7.2" y="17" width="3.5" height="4" rx="1.2" fill="url(#fhi-limb)" stroke="#00b8ff" stroke-width="0.14" stroke-opacity="0.4"/>
  <rect x="13.3" y="17" width="3.5" height="4" rx="1.2" fill="url(#fhi-limb)" stroke="#e8234a" stroke-width="0.14" stroke-opacity="0.4"/>
  <!-- Body (solid — faces are painted, never cut out) -->
  <path d="M9 4 L15 4 A4 4 0 0 1 19 8 L19 12 A4 4 0 0 1 15 16 L9 16 A4 4 0 0 1 5 12 L5 8 A4 4 0 0 1 9 4 Z" fill="#191327"/>
  <path d="M9 4 L15 4 A4 4 0 0 1 19 8 L19 12 A4 4 0 0 1 15 16 L9 16 A4 4 0 0 1 5 12 L5 8 A4 4 0 0 1 9 4 Z" fill="url(#fhi-lo)"/>
  <path d="M9 4 L15 4 A4 4 0 0 1 19 8 L19 12 A4 4 0 0 1 15 16 L9 16 A4 4 0 0 1 5 12 L5 8 A4 4 0 0 1 9 4 Z" fill="url(#fhi-hi)"/>
  <!-- Chromatic rim light (misregistered-print identity) -->
  <path d="M5 11.5 L5 8 A4 4 0 0 1 9 4 L12 4" fill="none" stroke="#00b8ff" stroke-width="0.35" opacity="0.75"/>
  <path d="M19 8.5 L19 12 A4 4 0 0 1 15 16 L12.5 16" fill="none" stroke="#e8234a" stroke-width="0.35" opacity="0.75"/>
  <!-- Painted >< eyes -->
  <path fill="#33265c" stroke="#00b8ff" stroke-width="0.3" d="M8.5 8 L10.5 10 L8.5 12 L9.5 12 L11.5 10 L9.5 8 Z"/>
  <path fill="#33265c" stroke="#00b8ff" stroke-width="0.3" d="M15.5 8 L13.5 10 L15.5 12 L14.5 12 L12.5 10 L14.5 8 Z"/>
  <!-- Spider-Verse dimensional visor across eyes -->
  <rect x="5.8" y="7.2" width="12.4" height="2.8" rx="1.2" fill="#e8234a" opacity="0.55"/>
  <rect x="6.2" y="7.6" width="11.6" height="2" rx="0.9" fill="#08060e" opacity="0.45"/>
  <!-- Halftone dot texture on body -->
  <circle cx="7" cy="6" r="0.4" fill="#e8234a" opacity="0.25"/>
  <circle cx="9" cy="5.5" r="0.35" fill="#00b8ff" opacity="0.2"/>
  <circle cx="17" cy="6" r="0.4" fill="#e8234a" opacity="0.25"/>
  <circle cx="15" cy="14" r="0.35" fill="#00b8ff" opacity="0.2"/>
  <circle cx="8" cy="14.5" r="0.4" fill="#e8234a" opacity="0.2"/>
  <circle cx="16" cy="5.5" r="0.3" fill="#ffea00" opacity="0.15"/>
  <circle cx="10" cy="14" r="0.3" fill="#ffea00" opacity="0.15"/>
  <!-- Chromatic aberration ghosts at the sides -->
  <rect x="19.5" y="8" width="0.4" height="5" rx="0.2" fill="#e8234a" opacity="0.2"/>
  <rect x="4.2" y="9" width="0.4" height="4" rx="0.2" fill="#00b8ff" opacity="0.2"/>
</svg>

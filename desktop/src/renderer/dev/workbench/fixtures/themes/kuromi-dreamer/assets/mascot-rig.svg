<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -5 30 30">
  <!--
    Example rig: Kuromi Dreamer — the theme's flat mascot set rebuilt to the rig contract.
    Outline (white-body) style: depth comes from the shade gradient, not highlights.
    Identity colors (hardcoded on purpose):
      line #1A0F28 (theme fg) · charm pink #FF4FB8 · shade #d9cbe9
    Signature components baked into slots: jester hat + skull charm (slot-hat), devil
    tail as an extra part (rig-tail — optional id, trails like a limb if the app
    chooses to animate it).
    Contract: ../README.md
  -->
  <defs>
    <linearGradient id="g-lo" x1="0" y1="0" x2="0.22" y2="1">
      <stop offset="52%" stop-color="#d9cbe9" stop-opacity="0"/>
      <stop offset="100%" stop-color="#d9cbe9" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <g id="rig-root">
    <g id="rig-tail" data-pivot="19 14">
      <path d="M19 14 Q21 14 21.5 15.5 Q22 17 20.5 17.2 L21.5 18.2 L20 18 L21 19 L19.5 18.5 Z" fill="#1A0F28" opacity="0.85"/>
    </g>
    <g id="rig-arm-left" data-pivot="2.5 9">
      <rect x="1" y="9" width="3" height="4" rx="0.8" fill="#FFFFFF" stroke="#1A0F28" stroke-width="0.6"/>
    </g>
    <g id="rig-arm-right" data-pivot="21.5 9">
      <rect x="20" y="9" width="3" height="4" rx="0.8" fill="#FFFFFF" stroke="#1A0F28" stroke-width="0.6"/>
      <g id="slot-item"/>
    </g>
    <g id="rig-leg-left" data-pivot="8.95 17">
      <rect x="7.2" y="17" width="3.5" height="4" rx="1.2" fill="#FFFFFF" stroke="#1A0F28" stroke-width="0.6"/>
    </g>
    <g id="rig-leg-right" data-pivot="15.05 17">
      <rect x="13.3" y="17" width="3.5" height="4" rx="1.2" fill="#FFFFFF" stroke="#1A0F28" stroke-width="0.6"/>
    </g>
    <g id="rig-body">
      <path d="M9 4 L15 4 A4 4 0 0 1 19 8 L19 12 A4 4 0 0 1 15 16 L9 16 A4 4 0 0 1 5 12 L5 8 A4 4 0 0 1 9 4 Z" fill="#FFFFFF" stroke="#1A0F28" stroke-width="0.6"/>
      <path d="M9 4 L15 4 A4 4 0 0 1 19 8 L19 12 A4 4 0 0 1 15 16 L9 16 A4 4 0 0 1 5 12 L5 8 A4 4 0 0 1 9 4 Z" fill="url(#g-lo)"/>
      <g id="rig-face-idle">
        <path d="M7.5 9 L10 10 L7.5 11" fill="none" stroke="#1A0F28" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16.5 9 L14 10 L16.5 11" fill="none" stroke="#1A0F28" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M11 13 Q12 13.8 13 13" fill="none" stroke="#1A0F28" stroke-width="0.8" stroke-linecap="round"/>
        <g stroke="#1A0F28" stroke-width="0.4" stroke-linecap="round">
          <line x1="5.5" y1="10.5" x2="7" y2="10.5"/><line x1="5.5" y1="11.5" x2="7" y2="11.5"/>
          <line x1="17" y1="10.5" x2="18.5" y2="10.5"/><line x1="17" y1="11.5" x2="18.5" y2="11.5"/>
        </g>
      </g>
      <g id="rig-face-welcome" style="display:none">
        <ellipse cx="9.3" cy="10" rx="1.3" ry="1.8" fill="#1A0F28"/>
        <ellipse cx="14.7" cy="10" rx="1.3" ry="1.8" fill="#1A0F28"/>
        <circle cx="9.7" cy="9.2" r="0.55" fill="#FFFFFF"/><circle cx="15.1" cy="9.2" r="0.55" fill="#FFFFFF"/>
        <circle cx="8.8" cy="10.5" r="0.22" fill="#FFFFFF"/><circle cx="14.2" cy="10.5" r="0.22" fill="#FFFFFF"/>
        <path d="M10.8 13 Q12 14.2 13.3 12.9" fill="none" stroke="#1A0F28" stroke-width="0.8" stroke-linecap="round"/>
        <g stroke="#1A0F28" stroke-width="0.4" stroke-linecap="round">
          <line x1="5.5" y1="10.5" x2="7" y2="10.5"/><line x1="5.5" y1="11.5" x2="7" y2="11.5"/>
          <line x1="17" y1="10.5" x2="18.5" y2="10.5"/><line x1="17" y1="11.5" x2="18.5" y2="11.5"/>
        </g>
      </g>
      <g id="rig-face-curious" style="display:none">
        <ellipse cx="9.3" cy="10" rx="1.15" ry="1.6" fill="#1A0F28"/>
        <ellipse cx="14.7" cy="10" rx="1.15" ry="1.6" fill="#1A0F28"/>
        <g class="pupil"><circle cx="9.65" cy="9.35" r="0.5" fill="#FFFFFF"/><circle cx="8.95" cy="10.4" r="0.2" fill="#FFFFFF"/></g>
        <g class="pupil"><circle cx="15.05" cy="9.35" r="0.5" fill="#FFFFFF"/><circle cx="14.35" cy="10.4" r="0.2" fill="#FFFFFF"/></g>
        <path d="M13.6 7.5 Q14.7 7 15.8 7.5" fill="none" stroke="#1A0F28" stroke-width="0.45" stroke-linecap="round"/>
        <ellipse cx="12" cy="13" rx="0.45" ry="0.55" fill="none" stroke="#1A0F28" stroke-width="0.6"/>
        <g stroke="#1A0F28" stroke-width="0.4" stroke-linecap="round">
          <line x1="5.5" y1="10.5" x2="7" y2="10.5"/><line x1="5.5" y1="11.5" x2="7" y2="11.5"/>
          <line x1="17" y1="10.5" x2="18.5" y2="10.5"/><line x1="17" y1="11.5" x2="18.5" y2="11.5"/>
        </g>
      </g>
      <g id="rig-face-shocked" style="display:none">
        <circle cx="9.3" cy="10" r="1.7" fill="#1A0F28"/>
        <circle cx="14.7" cy="10" r="1.7" fill="#1A0F28"/>
        <circle cx="9.7" cy="9.5" r="0.45" fill="#FFFFFF"/><circle cx="15.1" cy="9.5" r="0.45" fill="#FFFFFF"/>
        <ellipse cx="12" cy="13.4" rx="0.8" ry="1" fill="#1A0F28"/>
        <g stroke="#1A0F28" stroke-width="0.4" stroke-linecap="round">
          <line x1="5.5" y1="10.5" x2="7" y2="10.5"/><line x1="5.5" y1="11.5" x2="7" y2="11.5"/>
          <line x1="17" y1="10.5" x2="18.5" y2="10.5"/><line x1="17" y1="11.5" x2="18.5" y2="11.5"/>
        </g>
      </g>
      <g id="rig-face-dizzy" style="display:none">
        <g stroke="#1A0F28" stroke-width="1" stroke-linecap="round">
          <line x1="8" y1="8.5" x2="10.6" y2="11.5"/><line x1="10.6" y1="8.5" x2="8" y2="11.5"/>
          <line x1="13.4" y1="8.5" x2="16" y2="11.5"/><line x1="16" y1="8.5" x2="13.4" y2="11.5"/>
        </g>
        <path d="M10.4 13.4 L11.2 12.8 L12 13.4 L12.8 12.8 L13.6 13.4" fill="none" stroke="#1A0F28" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
        <g stroke="#1A0F28" stroke-width="0.4" stroke-linecap="round">
          <line x1="5.5" y1="11" x2="7" y2="11.3"/><line x1="5.5" y1="12" x2="7" y2="12.3"/>
          <line x1="17" y1="11.3" x2="18.5" y2="11"/><line x1="17" y1="12.3" x2="18.5" y2="12"/>
        </g>
        <path d="M5 3 Q6 2 7 3 Q6 4 5 3" fill="none" stroke="#FF4FB8" stroke-width="0.5" stroke-linecap="round"/>
        <path d="M18 3 Q19 2 20 3 Q19 4 18 3" fill="none" stroke="#FF4FB8" stroke-width="0.5" stroke-linecap="round"/>
      </g>
      <g id="rig-face-blink" style="display:none">
        <path d="M8 10 Q9.3 10.9 10.6 10" fill="none" stroke="#1A0F28" stroke-width="0.9" stroke-linecap="round"/>
        <path d="M13.4 10 Q14.7 10.9 16 10" fill="none" stroke="#1A0F28" stroke-width="0.9" stroke-linecap="round"/>
        <path d="M11 13 Q12 13.8 13 13" fill="none" stroke="#1A0F28" stroke-width="0.8" stroke-linecap="round"/>
        <g stroke="#1A0F28" stroke-width="0.4" stroke-linecap="round">
          <line x1="5.5" y1="10.5" x2="7" y2="10.5"/><line x1="5.5" y1="11.5" x2="7" y2="11.5"/>
          <line x1="17" y1="10.5" x2="18.5" y2="10.5"/><line x1="17" y1="11.5" x2="18.5" y2="11.5"/>
        </g>
      </g>
      <g id="slot-eyewear"/>
    </g>
    <g id="slot-hat">
      <!-- signature component: jester peaks + bells + skull charm (also in ../components/hats/jester.svg) -->
      <path d="M7 4 L6.5 1.5 L9 3.5 Z" fill="#1A0F28"/>
      <path d="M17 4 L17.5 1.5 L15 3.5 Z" fill="#1A0F28"/>
      <circle cx="6.5" cy="1.5" r="0.5" fill="#FF4FB8"/><circle cx="17.5" cy="1.5" r="0.5" fill="#FF4FB8"/>
      <circle cx="12" cy="5.8" r="0.9" fill="#FF4FB8"/>
      <circle cx="11.7" cy="5.6" r="0.22" fill="#1A0F28"/><circle cx="12.3" cy="5.6" r="0.22" fill="#1A0F28"/>
      <rect x="11.7" y="6" width="0.6" height="0.4" fill="#1A0F28"/>
    </g>
    <g id="rig-hand-peek-right" style="display:none">
      <rect x="20.7" y="8.3" width="2.6" height="3.4" rx="1.17" fill="#FFFFFF" stroke="#1A0F28" stroke-width="0.6"/>
    </g>
    <g id="rig-hand-peek-left" style="display:none">
      <rect x="0.7" y="8.3" width="2.6" height="3.4" rx="1.17" fill="#FFFFFF" stroke="#1A0F28" stroke-width="0.6"/>
    </g>
  </g>
</svg>
